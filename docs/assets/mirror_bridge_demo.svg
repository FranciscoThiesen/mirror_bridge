<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <!-- Animated terminal demo: real output of `mirror_bridge generate` on the
       Open3D geometry example, then the module used from Python, Lua, JS.
       Hand-authored SMIL; renders animated inside GitHub READMEs. -->
  <defs>
    <style>
      .t  { fill: #cdd6f4; }
      .p  { fill: #a6e3a1; font-weight: bold; }
      .c  { fill: #89dceb; }
      .ok { fill: #a6e3a1; }
      .y  { fill: #f9e2af; }
      .d  { fill: #7f849c; }
      .hl { fill: #f38ba8; font-weight: bold; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="500" rx="10" fill="#181825"/>
  <rect x="0" y="0" width="760" height="34" rx="10" fill="#11111b"/>
  <rect x="0" y="24" width="760" height="10" fill="#11111b"/>
  <circle cx="22" cy="17" r="6" fill="#f38ba8"/>
  <circle cx="42" cy="17" r="6" fill="#f9e2af"/>
  <circle cx="62" cy="17" r="6" fill="#a6e3a1"/>
  <text x="380" y="21" text-anchor="middle" class="d" font-size="12">mirror_bridge — one struct in, three languages out</text>

  <g>
    <text x="20" y="62" opacity="0">
      <tspan class="p">$</tspan><tspan class="t" dx="8">mirror_bridge generate src/ --module open3d_geometry --lang all</tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="0.4s" fill="freeze"/>
    </text>
    <text x="20" y="88" class="y" opacity="0">Scanning for classes...
      <animate attributeName="opacity" to="1" dur="0.01s" begin="1.3s" fill="freeze"/>
    </text>
    <text x="20" y="110" opacity="0">
      <tspan class="ok">  ✓ Found:</tspan><tspan class="t" dx="6">PointCloud</tspan><tspan class="d" dx="6">in geometry.hpp</tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="1.7s" fill="freeze"/>
    </text>
    <text x="20" y="130" opacity="0">
      <tspan class="ok">  ✓ Found:</tspan><tspan class="t" dx="6">TriangleMesh</tspan><tspan class="d" dx="6">in geometry.hpp</tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="1.9s" fill="freeze"/>
    </text>
    <text x="20" y="150" opacity="0">
      <tspan class="ok">  ✓ Found:</tspan><tspan class="t" dx="6">LineSet, AxisAlignedBoundingBox</tspan><tspan class="d" dx="6">in geometry.hpp</tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="2.1s" fill="freeze"/>
    </text>
    <text x="20" y="176" opacity="0">
      <tspan class="ok">✓ Built:</tspan><tspan class="t" dx="6">build/open3d_geometry.so</tspan><tspan class="d" dx="10">(Python)</tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="3.2s" fill="freeze"/>
    </text>
    <text x="20" y="196" opacity="0">
      <tspan class="ok">✓ Built:</tspan><tspan class="t" dx="6">build/lua/open3d_geometry.so</tspan><tspan class="d" dx="10">(Lua)</tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="3.9s" fill="freeze"/>
    </text>
    <text x="20" y="216" opacity="0">
      <tspan class="ok">✓ Built:</tspan><tspan class="t" dx="6">build/open3d_geometry.node</tspan><tspan class="d" dx="10">(JavaScript)</tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="4.6s" fill="freeze"/>
    </text>
    <text x="20" y="242" opacity="0">
      <tspan class="hl">Binding code written by hand: 0 lines</tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="5.4s" fill="freeze"/>
    </text>

    <text x="20" y="280" opacity="0">
      <tspan class="p">$</tspan><tspan class="t" dx="8">python3</tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="6.4s" fill="freeze"/>
    </text>
    <text x="20" y="302" opacity="0">
      <tspan class="c">&gt;&gt;&gt;</tspan><tspan class="t" dx="6">pc = open3d_geometry.PointCloud([[0,0,0], [1,1,1], [2,0,1]])</tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="7.0s" fill="freeze"/>
    </text>
    <text x="20" y="322" opacity="0">
      <tspan class="c">&gt;&gt;&gt;</tspan><tspan class="t" dx="6">pc.get_center()</tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="7.8s" fill="freeze"/>
    </text>
    <text x="20" y="342" class="y" opacity="0">[1.0, 0.333, 0.667]
      <animate attributeName="opacity" to="1" dur="0.01s" begin="8.3s" fill="freeze"/>
    </text>

    <text x="20" y="374" opacity="0">
      <tspan class="c">lua&gt;</tspan><tspan class="t" dx="6">pc = geometry.PointCloud()  <tspan class="d">-- same class, Lua</tspan></tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="9.1s" fill="freeze"/>
    </text>
    <text x="20" y="396" opacity="0">
      <tspan class="c">node&gt;</tspan><tspan class="t" dx="6">const pc = new geometry.PointCloud()  <tspan class="d">// same class, JS</tspan></tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="9.8s" fill="freeze"/>
    </text>

    <text x="20" y="436" opacity="0">
      <tspan class="d"># Open3D's geometry module: 25,262 lines of hand-written pybind11</tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="10.8s" fill="freeze"/>
    </text>
    <text x="20" y="456" opacity="0">
      <tspan class="d"># mirror_bridge: </tspan><tspan class="hl">71 generated lines, one command, 42x faster ingest</tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="11.4s" fill="freeze"/>
    </text>

    <rect x="20" y="470" width="9" height="16" fill="#cdd6f4">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
