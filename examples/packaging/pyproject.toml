[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "my-mathlib"
version = "0.1.0"
description = "Example: distributable Python bindings via mirror_bridge"
requires-python = ">=3.7"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["my_mathlib*"]
