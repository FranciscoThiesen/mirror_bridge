name: Benchmarks

# Living benchmarks: regenerate the runtime table in
# docs/internals/benchmarks.md from a fresh run so the published numbers
# always reflect the current code. Monthly + on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/franciscothiesen/mirror_bridge-benchmark:latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run benchmark suite
        run: ./benchmarks/run_all_benchmarks.sh

      - name: Splice regenerated runtime table into the benchmarks page
        run: |
          python3 benchmarks/format_results.py \
            benchmarks/runtime/python/runtime_results.json \
            --commit "$GITHUB_SHA" \
            --env "GitHub Actions ubuntu-latest ($(nproc) cores, containerized)" \
            --fragment --strict > /tmp/runtime_fragment.md
          awk '
            /<!-- RUNTIME:BEGIN/ { print; system("cat /tmp/runtime_fragment.md"); skip=1; next }
            /<!-- RUNTIME:END/   { skip=0 }
            !skip
          ' docs/internals/benchmarks.md > /tmp/benchmarks.md
          mv /tmp/benchmarks.md docs/internals/benchmarks.md

      - name: Splice regenerated trading table into the benchmarks page
        run: |
          python3 benchmarks/format_trading_results.py \
            --commit "$GITHUB_SHA" \
            --env "GitHub Actions ubuntu-latest ($(nproc) cores, containerized)" \
            --fragment > /tmp/trading_fragment.md
          awk '
            /<!-- TRADING:BEGIN/ { print; system("cat /tmp/trading_fragment.md"); skip=1; next }
            /<!-- TRADING:END/   { skip=0 }
            !skip
          ' docs/internals/benchmarks.md > /tmp/benchmarks.md
          mv /tmp/benchmarks.md docs/internals/benchmarks.md

      # main is protected (PR-only), so the refresh lands as a PR for the
      # maintainer to merge. The action is a no-op when the page is unchanged.
      - name: Open PR with the regenerated page
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            docs/internals/benchmarks.md
            benchmarks/ratio_floors.json
          commit-message: "Regenerate runtime benchmarks page"
          title: "Regenerate runtime benchmarks page"
          body: |
            Automated benchmark refresh: the runtime suite was rerun on a
            GitHub Actions runner and the table in
            `docs/internals/benchmarks.md` regenerated from the results.
            Compare the ratio columns against the previous page; absolute
            times shift with runner hardware, ratios should be stable.

            If `benchmarks/ratio_floors.json` is in this PR, it is the
            baseline the regression gate compares against and the gate is
            unarmed until this merges. The run that produced this PR failed
            for exactly that reason.
          branch: bot/benchmarks-refresh
          delete-branch: true

      # Last, because on the run that establishes the floors this step fails,
      # and the PR above is what carries them into the repository. Failing
      # before it would mean the gate could never become armed.
      #
      # Ratios are the stable signal across machines, so the comparison is
      # against committed floors rather than absolute ns/op. Where a
      # competitor is faster the output says so without failing: that is a
      # fact to see, not a regression.
      - name: Gate the runtime ratios against the committed floors
        run: |
          python3 benchmarks/check_ratios.py \
            benchmarks/runtime/python/runtime_results.json \
            --require-floors
