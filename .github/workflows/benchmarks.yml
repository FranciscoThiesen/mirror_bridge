name: Benchmarks

# Living benchmarks: regenerate the runtime table in
# docs/internals/benchmarks.md from a fresh run so the published numbers
# always reflect the current code. Monthly + on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/franciscothiesen/mirror_bridge-benchmark:latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run benchmark suite
        run: ./benchmarks/run_all_benchmarks.sh

      # Ratios are the stable signal across machines, so the comparison is
      # against committed floors rather than absolute ns/op. Where a competitor
      # is faster the output says so without failing: that is a fact to see,
      # not a regression.
      #
      # This step records its result rather than acting on it. It has to run
      # before the PR step, because it is what writes ratio_floors.json and
      # `git add` stages nothing at all -- not even the paths that do exist --
      # if one of its pathspecs matches no file. A glob is no more lenient. The
      # failing is done by a later step. This relies on the benchmark suite
      # above having produced mirror_bridge numbers, which it must have for the
      # job to have got this far, since check_ratios.py refuses without them.
      - name: Gate the runtime ratios against the committed floors
        id: gate
        run: |
          set +e
          python3 benchmarks/check_ratios.py \
            benchmarks/runtime/python/runtime_results.json \
            --require-floors
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Splice regenerated runtime table into the benchmarks page
        run: |
          python3 benchmarks/format_results.py \
            benchmarks/runtime/python/runtime_results.json \
            --commit "$GITHUB_SHA" \
            --env "GitHub Actions ubuntu-latest ($(nproc) cores, containerized)" \
            --fragment > /tmp/runtime_fragment.md
          awk '
            /<!-- RUNTIME:BEGIN/ { print; system("cat /tmp/runtime_fragment.md"); skip=1; next }
            /<!-- RUNTIME:END/   { skip=0 }
            !skip
          ' docs/internals/benchmarks.md > /tmp/benchmarks.md
          mv /tmp/benchmarks.md docs/internals/benchmarks.md

      # format_trading_results.py refuses to render when numpy was absent,
      # because the page would then claim a vectorised comparison it never
      # made. That refusal is right, but it used to be fatal here, and this
      # step runs before the PR: one missing competitor threw away a runtime
      # table that had already regenerated cleanly. The whole monthly refresh
      # died that way, which is why the published page kept seven of the
      # twelve measured operations and ratio_floors.json never landed.
      #
      # So record the refusal and leave the committed trading fragment where
      # it is. It carries its own provenance line, so a page with a fresh
      # runtime table and last month's trading table still says which is
      # which. A later step does the failing, after the PR exists.
      - name: Splice regenerated trading table into the benchmarks page
        id: trading
        run: |
          set +e
          python3 benchmarks/format_trading_results.py \
            --commit "$GITHUB_SHA" \
            --env "GitHub Actions ubuntu-latest ($(nproc) cores, containerized)" \
            --fragment > /tmp/trading_fragment.md
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "the trading table did not render; keeping the committed one"
            exit 0
          fi
          set -e
          awk '
            /<!-- TRADING:BEGIN/ { print; system("cat /tmp/trading_fragment.md"); skip=1; next }
            /<!-- TRADING:END/   { skip=0 }
            !skip
          ' docs/internals/benchmarks.md > /tmp/benchmarks.md
          mv /tmp/benchmarks.md docs/internals/benchmarks.md

      # main is protected (PR-only), so the refresh lands as a PR for the
      # maintainer to merge. The action is a no-op when the page is unchanged.
      - name: Open PR with the regenerated page
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            docs/internals/benchmarks.md
            benchmarks/ratio_floors.json
          commit-message: "Regenerate runtime benchmarks page"
          title: "Regenerate runtime benchmarks page"
          body: |
            Automated benchmark refresh: the runtime suite was rerun on a
            GitHub Actions runner and the table in
            `docs/internals/benchmarks.md` regenerated from the results.
            Compare the ratio columns against the previous page; absolute
            times shift with runner hardware, ratios should be stable.

            If `benchmarks/ratio_floors.json` is in this PR, it is the
            baseline the regression gate compares against and the gate is
            unarmed until this merges. The run that produced this PR failed
            for exactly that reason.
          branch: bot/benchmarks-refresh
          delete-branch: true

      # The two checks that can fail run last, after the PR exists. Neither one
      # may stop the refresh from being published: a month's numbers are worth
      # more than the promptness of a red build, and on the run that first
      # establishes the ratio floors the gate fails by design -- the PR above is
      # what carries them into the repository, so failing before it would mean
      # the gate could never become armed.
      - name: Fail if a measured operation never reached the page
        run: |
          python3 benchmarks/format_results.py \
            benchmarks/runtime/python/runtime_results.json \
            --fragment --strict > /dev/null

      - name: Fail if the trading table could not be regenerated
        run: |
          if [ "${{ steps.trading.outputs.rc }}" != "0" ]; then
            echo "See the 'Splice regenerated trading table' step above for why."
            echo "The page kept its committed trading numbers; the runtime table is fresh."
            exit 1
          fi

      - name: Fail if a ratio regressed, or if nothing was gated
        run: |
          if [ "${{ steps.gate.outputs.rc }}" != "0" ]; then
            echo "See the 'Gate the runtime ratios' step above for which."
            exit 1
          fi
